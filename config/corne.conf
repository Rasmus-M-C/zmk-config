# Corne — wired (UART) split configuration
# Applies to both corne_left and corne_right (shared file, no _left/_right suffix)

# --- Split communication transport ---
# Disable BLE as the transport used *between the two halves*. This does NOT
# disable Bluetooth for connecting the keyboard to your computer — it only
# controls how the left/right halves talk to each other.
CONFIG_ZMK_SPLIT_BLE=n

# Explicit for clarity. ZMK will select the wired UART transport automatically
# once BLE split is disabled and a `zmk,wired-split` devicetree node is present
# (see corne.keymap), but setting it here makes the intent unambiguous and will
# cause a build error instead of silent fallback if the devicetree node is ever
# removed or misconfigured.
CONFIG_ZMK_SPLIT_WIRED=y

# --- Recommended while bringing up a new wired link ---
# Uncomment to get boot/log messages over USB CDC ACM (RTT/console), useful for
# confirming the UART link and kscan events are actually happening.
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y

# --- Common quality-of-life settings (optional, uncomment as desired) ---
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_TIMEOUT=900000
